# `prefer-lowest` is what catches a constraint looser than the code — it resolves
# the oldest versions the composer.json permits, which is what a consumer on a
# conservative lockfile gets.

name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependency-versions }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependency-versions: ['prefer-lowest', 'prefer-stable']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.dependency-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's
        # dist cache is keyed on a name whose contents change underneath it. A
        # restored archive is then silently stale: `composer install` reports
        # success and unpacks whatever was cached the first time. That is how
        # `vendor/bin/laranail-pint` went missing here while the tag carried it.
        # Everything else is immutable per version and stays cached.
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          if [ "${{ matrix.dependency-versions }}" = "prefer-lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Run the suite
        run: composer test

  # The load-bearing claim in this package's README is that it works with no
  # image extension at all — the SVG renderer emits text. Nothing above proves
  # it: the runner has GD compiled in, so a renderer that quietly required it
  # would pass every job.
  #
  # This one disables GD and Imagick outright and asserts initials still render.
  without-image-extensions:
    name: Without GD or Imagick
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP without the image extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, :gd, :imagick
          ini-values: disable_functions=
          coverage: none

      - name: Confirm they really are absent
        run: |
          php -r '
            foreach (["gd", "imagick"] as $ext) {
                if (extension_loaded($ext)) {
                    fwrite(STDERR, "$ext is loaded; this job proves nothing.\n");
                    exit(1);
                }
            }
            echo "no image extensions loaded.\n";
          '

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Run the suite
        run: composer test

      - name: The SVG renderer still draws initials
        run: |
          php -r '
            require "vendor/autoload.php";
            $renderer = new Simtabi\Laranail\Avatar\Adapters\Renderers\SvgRenderer;
            $identity = new Simtabi\Laranail\Avatar\Data\Identity(key: "ada@example.com", label: "Ada Lovelace");
            $avatar = $renderer->render($identity, Simtabi\Laranail\Avatar\Data\Appearance::default());
            if (! str_contains($avatar->bytes(), "AL")) {
                fwrite(STDERR, "the svg renderer did not draw the initials\n");
                exit(1);
            }
            echo "initials rendered with no image extension.\n";
          '
